<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/f1f95af2e7.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style/login/login.css">

    <title> CEJE </title>

</head>

<body>
    <header>
        <h1>Centro Educacional Jardin do Éden</h1>
        <h2>Uma escola de Gerações</h2>
    </header>

    <section id="ficha">

        <img class="boneco" src="imagens/boneco1.png" alt="Boneco Azul">
        <img  class="moeda" src="imagens/moeda.png" alt="Moeda">

        <div class="text-baner">
            <h1>Faça login</h1>
        </div>

        <div class="tabs">

            <button   class="tab active" data-tipo="responsavel">
                <p>Responsável</p>
            </button>

            <button  class="tab" data-tipo="professor">
                <p>Professor</p>
            </button>

            <button  class="tab" data-tipo="gestor">
                <p>Gestor</p>
            </button>

        </div>


        <div id="login">
            <div id="loginForm">
                <div class="input-one">
                    <label for="usuario">CPF</label>
                    <input
                        class="input-l"
                        type="text"
                        id="usuario"
                        
                    >
                </div>
                <div class="input-two">
                    <label for="senha">Senha</label>
                    <input
                        class="input-l"
                        type="password"
                        id="senha"
                        
                    >
                </div>

                <button
                    class="input-b" 
                    type="submit">
                    Entrar
                </button>
            </div>  
        </div>
        <a class="back" href="index.html">Clica aqui para voltar a página inicial</a>
        <p class="link-cadastro">Não possui uma conta?<a class="back" href="#"> Clique Aqui</a></p>

    </section>

    <footer >
    <p>CENTRO EDUCACIONAL JARDIM DO ÉDEN</p>
    </footer>

<script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/f1f95af2e7.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style/login/login.css">
    <link rel="stylesheet" href="style/login/expansinvo-L.css">
    <title>CEJE - Login</title>
    <style>
        #linkCadastroProf {
            display: none;                /* JS mostra quando aba Professor ativa */
            text-align: center;
            margin-top: 12px;
            font-size: 0.95rem;
        }
        #linkCadastroProf a {
            color: var(--destaque);
            font-weight: bold;
            text-decoration: none;
        }
        #linkCadastroProf a:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <header class="text-fixo">
        <h1>Centro Educacional Jardin do Éden</h1>
        <h2>Uma escola de Gerações</h2>
    </header>

    <section id="ficha">

        <nav id="MCL">
            <a href="index.html">Inicio <i class="fa-solid fa-home"></i></a>
            <a href="matricula.html">Matriculas <i class="fa-solid fa-graduation-cap"></i></a>
        </nav>

        <img class="boneco" src="imagens/boneco1.png" alt="Boneco Azul">
        <img class="moeda"  src="imagens/moeda.png"   alt="Moeda">

        <div class="text-banerL">
            <h1>Faça login</h1>
        </div>

        <div class="tabs">
            <button id="responsavel" class="tab ativa" data-tipo="responsavel">
                <p>Responsável</p>
            </button>
            <button id="professor" class="tab" data-tipo="professor">
                <p>Professor</p>
            </button>
            <button id="gestor" class="tab" data-tipo="gestor">
                <p>Gestor</p>
            </button>
        </div>

        <div id="login">
            <div id="loginForm">
                <div class="input-one">
                    <label for="usuario">CPF</label>
                    <input
                        class="input-l"
                        type="text"
                        id="usuario"
                        autocomplete="off"
                    >
                </div>

                <button class="input-b" type="button">Entrar</button>

                <div id="linkCadastroProf">
                    <a href="cadastro-professor.htm">
                        <i class="fa-solid fa-user-plus"></i> Ainda não tem cadastro? Cadastre-se como professor
                    </a>
                </div>
            </div>
        </div>

        <a class="back" href="index.html">Clique aqui para voltar à página inicial</a>

        <footer>
            <p>CENTRO EDUCACIONAL JARDIM DO ÉDEN</p>
        </footer>
    </section>

    <script src="style/login/script/script.js"></script>
    <script>
        // Mostra o link "Cadastrar-se" apenas quando a aba Professor está ativa.
        // Não mexe no script.js principal (que cuida da seleção das abas).
        (function () {
            const link = document.getElementById('linkCadastroProf');
            const abaProf = document.getElementById('professor');
            const abaResp = document.getElementById('responsavel');
            const abaGest = document.getElementById('gestor');
            if (!link) return;

            function atualizar() {
                link.style.display = abaProf && abaProf.classList.contains('ativa') ? 'block' : 'none';
            }
            // Observa cliques nas abas
            [abaProf, abaResp, abaGest].forEach(b => {
                if (b) b.addEventListener('click', () => setTimeout(atualizar, 10));
            });
            atualizar();
        })();
    </script>
</body>
</html>

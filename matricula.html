<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/matriculas/matriculas.css">

    <title>CEJE</title>

</head>

<body>
    <header>   
        <h1>Centro Educacional Jardin do Éden</h1>
        <h2>Uma escola de Gerações</h2>
    </header>
    <nav id="MCL">
        <a href="index.html">Inicio <i class="fa-solid fa-graduation-cap"></i></a>
        <a href="#">Cadastro <i class="fa-solid fa-user-plus"></i></a>
        <a href="login.htm">Login <i class="fa-solid fa-key"></i></a>
    </nav>

    <main id="dados-container">
            <h1 class="titulo">Matriculas</h1>
    
        <div class="etapa1">
            <fieldset class="dados-aluno">
                <legend class="titulo">Dados Pessoais do Aluno</legend>
                <form id="formulario">
                    <section class="etapa-ativa">
            
                        <label for="#iname">Nome:</label>
                        <input
                            class="input-aluno"
                            id="inome"
                            name="nome"
                            type="text"
                            method="post"
                            placeholder="Digite o nome completo do aluno"
                            autocomplete="on"
                            required
                        >
                        <label for="#idata">Data de Nascimento:</label>
                        <input
                            class="input-aluno"
                            id="idata"
                            name="data"
                            type="date"
                            required
                        >
            
                        <fieldset>
                            <legend>Sexo:</legend>
                            <div class="sexo">
                                <div class="sexo-m">
                                        <input
                                            id="isexoM"
                                            name="sexo"
                                            type="radio"
                                            checked
                                        >
                                        <label class=" subtitulo" for="isexoM">Masculino</label>
                                </div>
                                <div class="sexo-f">
                                    <input
                                        id="isexoF"
                                        name="sexo"
                                        type="radio"
                                    >
                                    <label class=" subtitulo" for="isexoF">Feminino</label>
                                </div>
                            </div>
                        </fieldset>

                         <label for="#inacionalidade">Nacionalidade:</label>
                        <input 
                            class="input-aluno" 
                            id="inacionalidade" 
                            name="nacionalidade"
                            type="text">

                        <label for="#icdidade">Cidade de nascimento:</label>
                        <input 
                            class="input-aluno"
                            id="icdidade"
                            name="cdidade" 
                            type="text">
                            
                        <label for="#iendereço">Endereço:</label>
                        <input 
                            class="input-aluno"
                            id="iendereço" 
                            name="endereço" 
                            type="text">
                        
                        <label for="#in">N:</label>
                        <input 
                            class="input-aluno"
                            id="in" 
                            name="n" 
                            type="number">

                        <label for="#ibairro">Bairro:</label>
                        <input 
                            class="input-aluno"
                            id="ibairro" 
                            name="bairro" 
                            type="text">
                        
                        
                            
                        <label for="#icidade">Cidade:</label>
                        <input 
                            class="input-aluno"
                            id="icidade" 
                            name="cidade" 
                            type="text">

                        <label for="#iestado">Estado:</label>
                        <input 
                            class="input-aluno"
                            id="iestado" 
                            name="estado" 
                            type="text">

                        <label for="#icep">CEP:</label>
                        <input 
                            class="input-aluno"
                            id="icep" 
                            name="cep" 
                            type="number">

                        <label for="#icpf">CPF:</label>
                        <input 
                            class="input-aluno"
                            id="icpf" 
                            name="cpf" 
                            type="number">

                        <label for="#irg">RG:</label>
                        <input 
                            class="input-aluno"
                            id="irg" 
                            name="rg" 
                            type="number">



                        <label for="#iniss">NISS:</label>
                        <input 
                            class="input-aluno"
                            id="inss" 
                            name="niss" 
                            type="number">

                        <label for="#iturma">Turma:</label>
                        <select name="turma" id="iturma">
                            <option value="disabled" selected>Selecione uma turma</option>
                            <option value="infantil-I a">Infantil I A</option>
                            <option value="infantil-I b">Infantil I B</option>
                            <option value="infantil-II a">Infantil II A</option>
                            <option value="infantil-II b">Infantil II B</option>
                            <option value="infantil-III a">Infantil III A</option>
                            <option value="infantil-III b">Infantil III B</option>
                            <option value="1ano-a">1º Ano A</option>
                            <option value="1ano-b">1º Ano B</option>
                            <option value="2ano-a">2º Ano A</option>
                            <option value="2ano-b">2º Ano B</option>
                            <option value="3ano-a">3º Ano A</option>
                            <option value="1ano-a">4º Ano A</option>
                            <option value="1ano-b">4º Ano B</option>
                            <option value="2ano-a">5º Ano A</option>
                            <option value="2ano-b">5º Ano B</option>
                            <option value="3ano-a">6º Ano A</option>
                            <option value="1ano-a">7º Ano A</option>
                            <option value="2ano-a">7º Ano A</option>
                            <option value="3ano-a">8º Ano A</option>
                            <option value="3ano-a">8º Ano A</option>
                        </select>
        



                    </section>
                </form>
            </fieldset>
        </div>
       
        <!--
            <section class="etapa">
             
                <div class="botoes">
                    <button type="button" class="btnVoltar">
                        Voltar
                    </button>
                    <button type="submit">
                        Finalizar matrícula
                    </button>
                </div>
                
            </section>

        -->


       <div class="etapa2">
            <fieldset class="dados-aluno">
                <legend class="titulo">Dados Pessoais dos Responsáveis</legend>
                <form id="formulario">
                    <section class="etapa">
                        
                        <label for="#iname">Nome do Pai:</label>
                            <input
                                class="input-responsavel"
                                id="inome"
                                name="nome"
                                type="text"
                                method="post"
                                placeholder="Digite o nome completo do aluno"
                                autocomplete="on"
                                required
                            >
                        <label for="#iname">Profissão do Pai:</label>
                            <input
                                class="input-responsavel"
                                id="iprofissao-pai"
                                name="profissao-pai"
                                type="text"
                                method="post"
                                placeholder="Digite a profissão do pai"
                                autocomplete="on"
                                required
                            >
                        <label for="#iname">Identidade do Pai:</label>
                            <input
                                class="input-responsavel"
                                id="iidentidade-pai"
                                name="identidade-pai"
                                type="text"
                                method="post"
                                placeholder="Digite a identidade do pai"
                                autocomplete="on"
                                required
                            >
                        <label for="#iname">Cpf do Pai:</label>
                            <input
                                class="input-responsavel"
                                id="icpf-pai"
                                name="cpf-pai"
                                type="text"
                                method="post"
                                placeholder="Digite o CPF do pai"
                                autocomplete="on"
                                required
                            >
                        <label for="#iname">WhatsApp do Pai:</label>
                            <input
                                class="input-responsavel"
                                id="iwhatsapp-pai"
                                name="whatsapp-pai"
                               type="text"
                                method="post"
                                 placeholder="Digite o WhatsApp do pai"
                                autocomplete="on"
                                required
                            >
                        <label for="#iname">Telefone do Pai:</label>
                            <input
                                class="input-responsavel"
                                id="itelefone-pai"
                                name="telefone-pai"
                                type="text"
                                method="post"
                                placeholder="Digite o telefone do pai"
                                autocomplete="on"
                                required
                            >
                       
                        <label for="#iname">Nome da Mãe:</label>
                            <input
                                class="input-responsavel"
                                id="inome-mae"
                                name="nome-mae"
                                type="text"
                                method="post"
                                placeholder="Digite o nome completo da mãe"
                                autocomplete="on"
                                required
                            >
                        <label for="#iname">Profissão da Mãe:</label>
                            <input
                                class="input-responsavel"
                                id="iprofissao-mae"
                                name="profissao-mae"
                                type="text"
                                method="post"
                                placeholder="Digite a profissão da mãe"
                                autocomplete="on"
                                required
                            >
                        <label for="#iname">Identidade da Mãe:</label>
                            <input
                                class="input-responsavel"
                                id="iidentidade-mae"
                                name="identidade-mae"
                                type="text"
                                method="post"
                                placeholder="Digite a identidade da mãe"
                                autocomplete="on"
                                required
                            >
                        <label for="#iname">Cpf da Mãe:</label>
                            <input
                                class="input-responsavel"
                                id="icpf-mae"
                                name="cpf-mae"
                                type="text"
                                method="post"
                                placeholder="Digite o CPF da mãe"
                                autocomplete="on"
                                required
                            >
                        <label for="#iname">WhatsApp da Mãe:</label>
                            <input
                                class="input-responsavel"
                                id="iwhatsapp-mae"
                                name="whatsapp-mae"
                                type="text"
                                method="post"
                                placeholder="Digite o WhatsApp da mãe"
                                autocomplete="on"
                                required
                            >
                        <label for="#iname">Telefone da Mãe:</label>
                            <input
                                class="input-responsavel"
                                id="itelefone-mae"
                                name="telefone-mae"
                                type="text"
                                method="post"
                                placeholder="Digite o telefone da mãe"
                                autocomplete="on"
                                required
                            >
                      

                        <label for="#iname">Nome do Responsável:</label>
                        <select name="responsavel" id="iresponsavel">
                
                            <option value="pai">Pai</option>
                            <option value="mãe">Mãe</option>
                            <option value="outro">Responsável</option>
                            <option value="outro">
                                 <input
                                class="input-responsavel"
                                id="itelefone-mae"
                                name="telefone-mae"
                                type="text"
                                method="post"
                                placeholder="Digite o nome apenas se o responsável for diferente do pai ou da mãe"
                                autocomplete="on"
                                 required
                                >
                            </option>
                        </select>
                        
                    </section>
                </form>
            </fieldset>

        </div>
        <button type="button" id="btnProximo" onclick="proximo()">
                Próximo
        </button>
        <button type="button" id="btnVoltar" onclick="voltar()">
                Voltar
        </button>

    
     
    </main>
    
    <footer>
        <p>CENTRO EDUCACIONAL JARDIM DO ÉDEN</p>

    </footer>

    <script src="style/matriculas/script/script.js"></script>

</body>

</html>

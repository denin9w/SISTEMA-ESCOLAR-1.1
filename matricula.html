<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/matriculas/matriculas.css">
    <link rel="stylesheet" href="style/matriculas/expansivoM.css">
    <script src="https://kit.fontawesome.com/f1f95af2e7.js" crossorigin="anonymous"></script>

    <title>CEJE</title>

</head>

<body>
    <header>   
        <div class="text-fixo">
            <h1>Centro Educacional Jardin do Éden</h1>
            <h2>Uma escola de Gerações</h2>
        </div>
    </header>
    <nav id="MCL">
        <a href="index.html">Inicio <i class="fa-solid fa-graduation-cap"></i></a>
      
        <a href="login.htm">Login <i class="fa-solid fa-key"></i></a>
    </nav>


<main id="dados-container">

    <h1 class="titulo">Matrículas</h1>

    <form id="formulario" action="/registro" method="post">

        <!-- ================================================= -->
        <!-- ETAPA 1 - DADOS DO ALUNO                         -->
        <!-- ================================================= -->

        <div class="etapa1">

            <fieldset class="dados-aluno">

                <legend class="titulo">
                    Dados Pessoais do Aluno
                </legend>

                <section class="etapa-ativa">

                    <!-- NOME -->

                    <label for="inome">Nome:</label>

                    <input
                        class="input-aluno"
                        id="inome"
                        name="nome"
                        type="text"
                        placeholder="Digite o nome completo do aluno"
                        autocomplete="on"
                        required
                    >


                    <!-- DATA DE NASCIMENTO -->

                    <label for="idata">
                        Data de Nascimento:
                    </label>

                    <input
                        class="input-aluno"
                        id="idata"
                        name="data-nascimento"
                        type="date"
                        required
                    >


                    <!-- SEXO -->

                    <fieldset class="sexo-aluno">

                        <legend class="legend">
                            Sexo:
                        </legend>

                        <div class="sexo">

                            <div class="sexo-m">

                                <input
                                    id="isexoM"
                                    name="sexo"
                                    type="radio"
                                    value="Masculino"
                                    checked
                                >

                                <label
                                    class="subtitulo"
                                    for="isexoM"
                                >
                                    Masculino
                                </label>

                            </div>


                            <div class="sexo-f">

                                <input
                                    id="isexoF"
                                    name="sexo"
                                    type="radio"
                                    value="Feminino"
                                >

                                <label
                                    class="subtitulo"
                                    for="isexoF"
                                >
                                    Feminino
                                </label>

                            </div>

                        </div>

                    </fieldset>


                    <!-- NACIONALIDADE -->

                    <label for="inacionalidade">
                        Nacionalidade:
                    </label>

                    <input
                        class="input-aluno"
                        id="inacionalidade"
                        name="nacionalidade"
                        type="text"
                        placeholder="Digite a nacionalidade"
                    >


                    <!-- CIDADE DE NASCIMENTO -->

                    <label for="icidade-nascimento">
                        Cidade de nascimento:
                    </label>

                    <input
                        class="input-aluno"
                        id="icidade-nascimento"
                        name="cidade-nascimento"
                        type="text"
                        placeholder="Lugar onde a criança foi registrada"
                        required
                    >


                    <!-- ================================================= -->
                    <!-- ENDEREÇO                                           -->
                    <!-- ================================================= -->

                    <h3>ENDEREÇO</h3>


                    <!-- RUA -->

                    <label for="iendereco">
                        Rua:
                    </label>

                    <input
                        class="input-aluno"
                        id="iendereco"
                        name="endereco"
                        type="text"
                        placeholder="Rua atual"
                        required
                    >


                    <!-- BAIRRO -->

                    <label for="ibairro">
                        Bairro:
                    </label>

                    <input
                        class="input-aluno"
                        id="ibairro"
                        name="bairro"
                        type="text"
                        placeholder="Bairro atual"
                        required
                    >


                    <!-- NÚMERO -->

                    <label for="inumero">
                        Nº:
                    </label>

                    <input
                        class="input-aluno"
                        id="inumero"
                        name="numero-endereco"
                        type="number"
                        placeholder="408"
                        required
                    >


                    <!-- CIDADE -->

                    <label for="icidade">
                        Cidade:
                    </label>

                    <input
                        class="input-aluno"
                        id="icidade"
                        name="cidade"
                        type="text"
                        placeholder="Garanhuns..."
                        required
                    >


                    <!-- ESTADO -->

                    <label for="iestado">
                        UF:
                    </label>

                    <input
                        class="input-aluno"
                        id="iestado"
                        name="estado"
                        type="text"
                        placeholder="PE"
                        maxlength="2"
                        required
                    >


                    <!-- CEP -->

                    <label for="icep">
                        CEP:
                    </label>

                    <input
                        class="input-aluno"
                        id="icep"
                        name="cep"
                        type="text"
                        placeholder="00000-000"
                    >


                    <!-- CPF -->

                    <label for="icpf">
                        CPF:
                    </label>

                    <input
                        class="input-aluno"
                        id="icpf"
                        name="cpf"
                        type="text"
                        placeholder="000.000.000-00"
                        required
                    >


                    <!-- RG -->

                    <label for="irg">
                        RG:
                    </label>

                    <input
                        class="input-aluno"
                        id="irg"
                        name="rg"
                        type="text"
                        placeholder="00.000.000-0"
                        required
                    >


                    <!-- NISS -->

                    <label for="inss">
                        NISS:
                    </label>

                    <input
                        class="input-aluno"
                        id="inss"
                        name="niss"
                        type="text"
                        placeholder="000.00000.00-0"
                    >


                    <!-- TURMA -->

                    <label for="iturma">
                        Turma:
                    </label>

                    <select
                        name="turma"
                        id="iturma"
                        class="input-aluno"
                        required
                    >

                        <option value="" selected disabled>
                            Selecione uma turma
                        </option>

                        <option value="infantil-I-a">
                            Infantil I A
                        </option>

                        <option value="infantil-I-b">
                            Infantil I B
                        </option>

                        <option value="infantil-II-a">
                            Infantil II A
                        </option>

                        <option value="infantil-II-b">
                            Infantil II B
                        </option>

                        <option value="infantil-III-a">
                            Infantil III A
                        </option>

                        <option value="infantil-III-b">
                            Infantil III B
                        </option>

                        <option value="1ano-a">
                            1º Ano A
                        </option>

                        <option value="1ano-b">
                            1º Ano B
                        </option>

                        <option value="2ano-a">
                            2º Ano A
                        </option>

                        <option value="2ano-b">
                            2º Ano B
                        </option>

                        <option value="3ano-a">
                            3º Ano A
                        </option>

                        <option value="3ano-b">
                            3º Ano B
                        </option>

                        <option value="4ano-a">
                            4º Ano A
                        </option>

                        <option value="4ano-b">
                            4º Ano B
                        </option>

                        <option value="5ano-a">
                            5º Ano A
                        </option>

                        <option value="5ano-b">
                            5º Ano B
                        </option>

                        <option value="6ano-a">
                            6º Ano A
                        </option>

                        <option value="6ano-b">
                            6º Ano B
                        </option>

                        <option value="7ano-a">
                            7º Ano A
                        </option>

                        <option value="7ano-b">
                            7º Ano B
                        </option>

                        <option value="8ano-a">
                            8º Ano A
                        </option>

                        <option value="8ano-b">
                            8º Ano B
                        </option>

                        <option value="9ano-a">
                            9º Ano A
                        </option>

                        <option value="9ano-b">
                            9º Ano B
                        </option>

                    </select>


                    <!-- OBSERVAÇÃO -->

                    <label for="iobs">
                        Observação:
                    </label>

                    <textarea
                        name="observacao"
                        id="iobs"
                        placeholder="Digite alguma observação sobre o aluno."
                    ></textarea>

                </section>

            </fieldset>

        </div>



        <!-- ================================================= -->
        <!-- ETAPA 2 - RESPONSÁVEIS                           -->
        <!-- ================================================= -->

        <div class="etapa2">

            <fieldset class="dados-aluno">

                <legend class="titulo">
                    Dados Pessoais dos Responsáveis
                </legend>

                <section class="etapa">


                    <!-- ========================== -->
                    <!-- PAI                        -->
                    <!-- ========================== -->

                    <h3>Dados do Pai</h3>


                    <label for="inomeP">
                        Nome do Pai:
                    </label>

                    <input
                        class="input-responsavel"
                        id="inomeP"
                        name="nome-pai"
                        type="text"
                        placeholder="Digite o nome completo do pai"
                        autocomplete="on"
                    >


                    <label for="iprofissao-pai">
                        Profissão do Pai:
                    </label>

                    <input
                        class="input-responsavel"
                        id="iprofissao-pai"
                        name="profissao-pai"
                        type="text"
                        placeholder="Digite a profissão do pai"
                        autocomplete="on"
                    >


                    <label for="iidentidade-pai">
                        Identidade do Pai:
                    </label>

                    <input
                        class="input-responsavel"
                        id="iidentidade-pai"
                        name="identidade-pai"
                        type="text"
                        placeholder="Digite a identidade do pai"
                    >


                    <label for="icpf-pai">
                        CPF do Pai:
                    </label>

                    <input
                        class="input-responsavel"
                        id="icpf-pai"
                        name="cpf-pai"
                        type="text"
                        placeholder="Digite o CPF do pai"
                    >


                    <label for="iwhatsapp-pai">
                        WhatsApp do Pai:
                    </label>

                    <input
                        class="input-responsavel"
                        id="iwhatsapp-pai"
                        name="whatsapp-pai"
                        type="text"
                        placeholder="Digite o WhatsApp do pai"
                    >


                    <label for="itelefone-pai">
                        Telefone do Pai:
                    </label>

                    <input
                        class="input-responsavel"
                        id="itelefone-pai"
                        name="telefone-pai"
                        type="text"
                        placeholder="Digite o telefone do pai"
                    >



                    <!-- ========================== -->
                    <!-- MÃE                        -->
                    <!-- ========================== -->

                    <h3>Dados da Mãe</h3>


                    <label for="inome-mae">
                        Nome da Mãe:
                    </label>

                    <input
                        class="input-responsavel"
                        id="inome-mae"
                        name="nome-mae"
                        type="text"
                        placeholder="Digite o nome completo da mãe"
                        autocomplete="on"
                    >


                    <label for="iprofissao-mae">
                        Profissão da Mãe:
                    </label>

                    <input
                        class="input-responsavel"
                        id="iprofissao-mae"
                        name="profissao-mae"
                        type="text"
                        placeholder="Digite a profissão da mãe"
                    >


                    <label for="iidentidade-mae">
                        Identidade da Mãe:
                    </label>

                    <input
                        class="input-responsavel"
                        id="iidentidade-mae"
                        name="identidade-mae"
                        type="text"
                        placeholder="Digite a identidade da mãe"
                    >


                    <label for="icpf-mae">
                        CPF da Mãe:
                    </label>

                    <input
                        class="input-responsavel"
                        id="icpf-mae"
                        name="cpf-mae"
                        type="text"
                        placeholder="Digite o CPF da mãe"
                    >


                    <label for="iwhatsapp-mae">
                        WhatsApp da Mãe:
                    </label>

                    <input
                        class="input-responsavel"
                        id="iwhatsapp-mae"
                        name="whatsapp-mae"
                        type="text"
                        placeholder="Digite o WhatsApp da mãe"
                    >


                    <label for="itelefone-mae">
                        Telefone da Mãe:
                    </label>

                    <input
                        class="input-responsavel"
                        id="itelefone-mae"
                        name="telefone-mae"
                        type="text"
                        placeholder="Digite o telefone da mãe"
                    >



                    <!-- ========================== -->
                    <!-- RESPONSÁVEL LEGAL          -->
                    <!-- ========================== -->

                    <h3>Responsável pela Matrícula</h3>


                    <label for="iresponsavel">
                        Responsável:
                    </label>

                    <select
                        name="responsavel"
                        id="iresponsavel"
                    >

                        <option value="pai">
                            Pai
                        </option>

                        <option value="mae">
                            Mãe
                        </option>

                        <option value="outro">
                            Outro
                        </option>

                    </select>


                    <label for="iresponsavelO">
                        Caso seja outro:
                    </label>

                    <input
                        type="text"
                        id="iresponsavelO"
                        name="responsavel-outro"
                        placeholder="Avó / Avô / Tio / Tia"
                    >

                </section>

            </fieldset>

        </div>



        <!-- ================================================= -->
        <!-- BOTÕES                                            -->
        <!-- ================================================= -->

        <div class="botoes">

            <button
                type="button"
                id="btnProximo"
                onclick="proximo()"
            >
                Próximo
            </button>


            <button
                type="button"
                id="btnVoltar"
                onclick="voltar()"
            >
                Voltar
            </button>


            <button
                type="submit"
                id="btnFinalizar"
            >
                Finalizar matrícula
            </button>

        </div>

    </form>

    <ul id="listaMatricula">

    </ul>

</main>

<footer>
    <p>CENTRO EDUCACIONAL JARDIM DO ÉDEN</p>

</footer>

<script src="style/matriculas/script/script.js"></script>

</body>

</html>

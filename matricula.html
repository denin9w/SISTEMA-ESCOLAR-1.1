            <h1 class="titulo">Matriculas</h1>
        <fieldset class="dados-aluno">
            <legend class="titulo">Dados Pessoais do Aluno</legend>
            <form id="formulario">

                <section class="etapa-ativa">
            
                    <label for="#iname">Nome:</label>
                    <input 
                        class="input-aluno"
                        id="inome" 
                        name="nome"      
                        type="text" 
                        method="post"
                        placeholder="Digite o nome completo do aluno"
                        autocomplete="on"
                        required
                    >

                    <label for="#idata">Data de Nascimento:</label>
                    <input
                        class="input-aluno"
                        id="idata"
                        name="data"
                        type="date"
                        required
                    >
                        
                    <fieldset>
                        <legend>Sexo:</legend>
                        <div class="sexo">
                            <div class="sexo-m">
                                    <input
                                        id="isexoM"
                                        name="sexo"
                                        type="radio"
                                        checked
                                    >
                                    <label class=" subtitulo" for="isexoM">Masculino</label>
                            </div>
                            <div class="sexo-f">
                                <input
                                    id="isexoF"
                                    name="sexo"
                                    type="radio"
                                >
                                <label class=" subtitulo" for="isexoF">Feminino</label>
                            </div>
                        </div>
                    </fieldset>
            
                   

                </section>
            </form>
        </fieldset>
        <button type="button" id="btnProximo">
            Próximo
        </button>

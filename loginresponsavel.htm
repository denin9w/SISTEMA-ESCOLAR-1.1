<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="stylesheet" href="style/login/login-responsavelExpansivo.css">
    <title>CEJE - Área do Responsável</title>
</head>

<body>
    <section id="header">
        <header class="text-fixo">
            <h1>Centro Educacional Jardin do Éden</h1>
            <h2>Uma escola de Gerações</h2>
        </header>
    </section>

    <img class="bonecoO" src="imagens/boneco1.png" alt="Boneco Azul">
    <img class="moedaO"  src="imagens/moeda.png"   alt="Moeda">

    <section id="ficha">
        <nav id="MCL">
            <a href="index.html">Inicio <i class="fa-solid fa-home"></i></a>
            <a href="matricula.html">Matriculas <i class="fa-solid fa-graduation-cap"></i></a>
            <a href="login.htm" id="btnSair">Sair <i class="fa-solid fa-door-open"></i></a>
        </nav>

        <div class="elemento-onput">
            <img class="boneco" src="imagens/boneco1.png" alt="Boneco Azul">
            <img class="moeda"  src="imagens/moeda.png"   alt="Moeda">
        </div>

        <div class="text-banerL">
            <h1>Bem vindo à Área do Responsável</h1>
            <p id="alunoLogadoNome" style="text-align:center; font-weight:bold; color:var(--titlecor); margin-top:10px;"></p>
            <h2>Visualize e solicite seus documentos</h2>
        </div>

        <div id="documentos">
            <div class="documentos-itens">

                <label class="opçao-card">
                    <input type="checkbox" name="Transferência" id="itransferencia">
                    <div class="conteudo-card">
                        <span class="icone"><i class="fa-solid fa-arrow-right-arrow-left"></i></span>
                        <span class="texto-icone">Transferência</span>
                        <button class="btn-visualizar" type="button" data-doc="Transferência">Visualizar</button>
                    </div>
                </label>

                <label class="opçao-card">
                    <input type="checkbox" name="Ficha Individual" id="ificha-Individual">
                    <div class="conteudo-card">
                        <span class="icone"><i class="fa-solid fa-clipboard-list"></i></span>
                        <span class="texto-icone">Ficha Individual</span>
                        <button class="btn-visualizar" type="button" data-doc="Ficha Individual">Visualizar</button>
                    </div>
                </label>

                <label class="opçao-card">
                    <input type="checkbox" name="Bolsa Família" id="ibolsa-Familia">
                    <div class="conteudo-card">
                        <span class="icone"><i class="fa-solid fa-file-lines"></i></span>
                        <span class="texto-icone">Bolsa Família</span>
                        <button class="btn-visualizar" type="button" data-doc="Bolsa Família">Visualizar</button>
                    </div>
                </label>

                <label class="opçao-card">
                    <input type="checkbox" name="Boletim" id="iBoletim">
                    <div class="conteudo-card">
                        <span class="icone"><i class="fa-regular fa-file-pdf"></i></span>
                        <span class="texto-icone">Boletim</span>

                <label class="opçao-card">
                    <input type="checkbox" name="Declaração de Quitação Simples" id="ideclaracao-quitacao-simples">
                    <div class="conteudo-card">
                        <span class="icone"><i class="fa-solid fa-file-invoice-dollar"></i></span>
                        <span class="texto-icone">Quitação Simples</span>
                        <button class="btn-visualizar" type="button" data-doc="Declaração de Quitação Simples">Visualizar</button>
                    </div>
                </label>

                <label class="opçao-card">
                    <input type="checkbox" name="Declaração de Quitação Tabela" id="ideclaracao-quitacao-tabela">
                    <div class="conteudo-card">
                        <span class="icone"><i class="fa-solid fa-table"></i></span>
                        <span class="texto-icone">Quitação Tabela</span>
                        <button class="btn-visualizar" type="button" data-doc="Declaração de Quitação Tabela">Visualizar</button>
                    </div>
                </label>

                <label class="opçao-card">
                    <input type="checkbox" name="Declaração de Matrícula" id="ideclaracao-matricula">
                    <div class="conteudo-card">
                        <span class="icone"><i class="fa-solid fa-id-card"></i></span>
                        <span class="texto-icone">Declaração de Matrícula</span>
                        <button class="btn-visualizar" type="button" data-doc="Declaração de Matrícula">Visualizar</button>

                <label class="opçao-card">
                    <input type="checkbox" name="Declaração Provisória" id="iprovissoria">
                    <div class="conteudo-card">
                        <span class="icone"><i class="fa-solid fa-file-circle-exclamation"></i></span>
                        <span class="texto-icone">Provisória</span>
                        <button class="btn-visualizar" type="button" data-doc="Declaração Provisória">Visualizar</button>
                    </div>
                </label>

                <label class="opçao-card">
                    <input type="checkbox" name="Recibo" id="irecibo">
                    <div class="conteudo-card">
                        <span class="icone"><i class="fa-solid fa-receipt"></i></span>
                        <span class="texto-icone">Recibo</span>
                        <button class="btn-visualizar" type="button" data-doc="Recibo">Visualizar</button>
                    </div>
                </label>

                <label class="opçao-card">
                    <input type="checkbox" name="Recibo de Pagamento" id="irecibo-pagamento">
                    <div class="conteudo-card">
                        <span class="icone"><i class="fa-solid fa-money-check-dollar"></i></span>
                        <span class="texto-icone">Recibo de Pagamento</span>
                        <button class="btn-visualizar" type="button" data-doc="Recibo de Pagamento">Visualizar</button>
                    </div>
                </label>

            </div>

            <button class="input-br" id="btnSolicitar" type="button">Solicitar</button>
            <a class="back" href="index.html">Clique aqui para voltar à página inicial</a>
        </div>

        <footer>
            <p>CENTRO EDUCACIONAL JARDIM DO ÉDEN</p>
        </footer>
    </section>

    <!-- Carrega modelos e Supabase -->
    <script src="documentos/html/templates-docs.js"></script>
    <script src="style/login/script/scriptResponsavel.js"></script>

    <!-- Visualização / download dos documentos -->
    <script>
    (function () {
        function abrirDocHTML(nomeDoc) {
            const alunoId = localStorage.getItem("@alunoLogadoId");
            if (!alunoId) { alert("Sessão expirada."); return; }

            // Busca os dados do aluno no Supabase (o cliente do scriptResponsavel.js)
            if (!window.supabaseClient) {
                alert("Aguarde, conectando ao banco...");
                return;
            }
            window.supabaseClient.from('alunos').select('*').eq('id', alunoId).single()
                .then(({ data, error }) => {
                    if (error || !data) { alert("Erro ao carregar dados do aluno."); return; }
                    const fn = DOCUMENTOS_HTML[nomeDoc];
                    if (!fn) { alert("Modelo não encontrado: " + nomeDoc); return; }
                    const html = fn(data);
                    const win = window.open('', '_blank');
                    win.document.write(html);
                    win.document.close();
                })
                .catch(e => { console.error(e); alert("Erro ao abrir documento."); });
        }

        function baixarBoletim(nomeDoc) {
            const alunoId = localStorage.getItem("@alunoLogadoId");
            if (!alunoId) { alert("Sessão expirada."); return; }
            window.supabaseClient.from('alunos').select('*').eq('id', alunoId).single()
                .then(({ data, error }) => {
                    if (error || !data) { alert("Erro ao carregar dados."); return; }
                    const fn = DOCUMENTOS_HTML[nomeDoc];
                    if (!fn) return alert("Modelo não encontrado.");
                    const html = fn(data);
                    // Baixa como .doc (Word abre HTML nativamente)
                    const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Boletim-${data.nome.replace(/\s+/g,'_')}.doc`;
                    a.click();
                    URL.revokeObjectURL(url);
                });
        }

        document.querySelectorAll('.btn-visualizar').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const nomeDoc = btn.dataset.doc;
                if (nomeDoc === 'Boletim') {
                    baixarBoletim(nomeDoc);
                } else {
                    abrirDocHTML(nomeDoc);
                }
            });
        });
    })();
    </script>

    <!-- Botão Sair -->
    <script>
    (function () {
        const sair = document.getElementById('btnSair');
        if (sair) {
            sair.addEventListener('click', function (e) {
                e.preventDefault();
                localStorage.removeItem("@alunoLogadoId");
                localStorage.removeItem("@alunoLogadoNome");
                localStorage.removeItem("@professorLogado");
                localStorage.removeItem("@gestorLogado");
                window.location.href = "login.htm";
            });
        }
    })();
    </script>
</body>
</html>

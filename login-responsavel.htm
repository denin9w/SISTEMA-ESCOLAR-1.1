<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/f1f95af2e7.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style/login/login-responsavel.css">
    <link rel="stylesheet" href="style/login/login-responsavelExpansivo.css">
    
    <title> CEJE </title>

</head>

<body>


    <header class="text-fixo">
            <h1>Centro Educacional Jardin do Éden</h1>
            <h2>Uma escola de Gerações</h2>
    </header>
 

    <section id="ficha">

        <nav id="MCL">
            <a href="index.html">Inicio <i class="fa-solid fa-home-cap"></i></a>
        
            <a href="matricula.html">Matriculas <i class="fa-solid fa-graduation-cap"></i></a>
        </nav>

        <img class="boneco" src="imagens/boneco1.png" alt="Boneco Azul">
        <img  class="moeda" src="imagens/moeda.png" alt="Moeda">

        <div class="text-banerL">
            <h1>Bem vindo a Area do responsavel</h1>
            <h2>Solicite seu documento</h2>
        </div>
    
        <div id="documentos">

            <div class="documentos-itens">

                <label for="itransferencia" class="opçao-card">
                    <input type="checkbox" name="transferencia" id="itransferencia">
                    <div class="conteudo-card">
                        <span class="icone">
                            <i class="fa-solid fa-arrow-right-arrow-left"></i>
                        </span>

                        <span class="texto-icone">
                            Transferencia
                        </span>
                    </div>
                </label>

                <label class="opçao-card">
                    <input type="checkbox" name="transferencia" id="itransferencia">
                    <div class="conteudo-card">
                        <span class="icone">
                            <i class="fa-solid fa-clipboard-list"></i>
                        </span>

                        <span class="texto-icone">
                            Ficha-Individual
                        </span>
                    </div>
                </label>

                <label class="opçao-card">
                    <input type="checkbox" name="transferencia" id="itransferencia">
                    <div class="conteudo-card">
                        <span class="icone">
                            <i class="fa-solid fa-file-lines"></i>
                        </span>

                        <span class="texto-icone">
                            Declaração de Bolsa familia
                        </span>
                    </div>
                </label>
                
                <label class="opçao-card">
                    <input type="checkbox" name="transferencia" id="itransferencia">
                    <div class="conteudo-card">
                        <span class="icone">
                           <i class="fa-regular fa-file-pdf"></i>
                        </span>

                        <span class="texto-icone">
                            Boletim
                        </span>
                    </div>
                </label>
            
            </div>
              

            <button
                class="input-br" 
                type="submit">
                solicitar
            </button>

            
            <a class="back" href="index.html">Clica aqui para voltar a página inicial</a>
            
        </div>  

        <footer >
        <p>CENTRO EDUCACIONAL JARDIM DO ÉDEN</p>
        </footer>
        
    </section>

  

<script src="script.js"></script>
</body>

</html>
